name: CI

# Jarvis v3 (Electron/Node). Unit tests only: the live parts (Claude login, microphone, Spotify,
# Twitch, lights, FFmpeg exports) need real hardware and accounts a hosted runner doesn't have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every source file
        run: for f in $(git ls-files 'src/**/*.js' 'tests/*.js'); do node --check "$f"; done
      - name: Run tests (no Electron download needed)
        run: node --test tests/*.test.js

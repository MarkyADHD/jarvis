<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jarvis</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0e;
        --panel: #16181c;
        --text: #f3f1ea;
        --accent: #4fd6c8;
        --danger: #d95d5d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #setup-banner {
        background: #3a2a12;
        color: #f0c37a;
        padding: 10px 16px;
        font-size: 14px;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .message {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 10px;
        white-space: pre-wrap;
      }
      .message-user { align-self: flex-end; background: var(--accent); color: #06201d; }
      .message-assistant { align-self: flex-start; background: var(--panel); }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: var(--panel);
        border-top: 1px solid #222;
      }
      #input {
        flex: 1;
        resize: none;
        background: #0e0f11;
        color: var(--text);
        border: 1px solid #2a2c30;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 0 18px;
        font-size: 14px;
        cursor: pointer;
      }
      #send { background: var(--accent); color: #06201d; }
      #stop { background: var(--danger); color: #240909; }
      #talk { background: #2a2c30; color: var(--text); }
      #talk.recording { background: var(--danger); color: #240909; }
      button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <div id="setup-banner" hidden></div>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="Talk to Jarvis..."></textarea>
      <button id="talk" title="Hold to talk">🎤 Hold to talk</button>
      <button id="send">Send</button>
      <button id="stop">Stop</button>
    </div>
    <script type="module" src="./dist/renderer.js"></script>
  </body>
</html>

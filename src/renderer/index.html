<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Jarvis</title>
<style>
  :root{--bg:#07090b;--glass:rgba(18,24,28,.62);--edge:rgba(63,214,255,.14);--text:#f3eee6;--dim:#8f9a9a;--teal:#3fd6ff;--teal2:#1f6fb5;--amber:#ff9d1c;--warn:#ff9b6a;--r:18px}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;color:var(--text);font:14px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden;
    background:radial-gradient(60% 55% at 50% 46%,rgba(30,120,190,.18),transparent 70%),radial-gradient(120% 90% at 50% 120%,#0a1822,transparent 60%),var(--bg);
    display:grid;grid-template:64px 1fr/64px 1fr}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background:linear-gradient(transparent 0 97%,rgba(63,214,255,.06) 97%) 0 0/100% 44px,linear-gradient(90deg,transparent 0 97%,rgba(63,214,255,.05) 97%) 0 0/44px 100%;
    mask:radial-gradient(70% 60% at 50% 60%,#000,transparent)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none} :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .glass{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.04)}
  .glass{position:relative}
  .glass::before,.glass::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--teal);opacity:.7;pointer-events:none}
  .glass::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
  .glass::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
  .cap::after{content:"";display:inline-block;width:28px;height:2px;background:var(--amber);vertical-align:middle;margin-left:10px;opacity:.8}
  .cap{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:600;text-transform:uppercase}

  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.05)}
  .mark{font-weight:600;letter-spacing:.5em;font-size:15px;margin-right:12px}
  .mark span{color:var(--amber)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:var(--dim)}
  .chip i{width:7px;height:7px;border-radius:50%;background:#555} .chip.ok i{background:var(--teal);box-shadow:0 0 8px var(--teal)} .chip.bad i{background:var(--warn)}
  .chip.live{color:var(--warn);border-color:rgba(255,155,106,.4)} .chip.live i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .time{margin-left:auto;text-align:right;line-height:1.2} .time b{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums} .time small{display:block;color:var(--dim);font-size:11px}

  nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px;border-right:1px solid rgba(255,255,255,.05)}
  nav button{width:42px;height:42px;border-radius:12px;color:var(--dim);display:grid;place-items:center}
  nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav button[aria-current]{color:var(--teal);background:rgba(63,214,255,.08)} nav button:hover{color:var(--text)}

  main{min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;padding:22px} .view.on{display:grid}
  #home{grid-template-columns:280px 1fr 380px;gap:22px}
  .col{display:flex;flex-direction:column;gap:18px;min-height:0}
  .glass.pad{padding:18px 20px}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px} .row b{font-weight:400;font-size:22px}
  .meter{height:3px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:6px;overflow:hidden} .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .8s}
  #work{margin-top:10px;color:var(--dim)} #work b{display:block;color:var(--text);font-weight:400}
  .shortcuts{display:grid;gap:8px;margin-top:12px}
  .shortcuts button{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
  .shortcuts button:hover{border-color:var(--edge);background:rgba(63,214,255,.06)}

  .center{display:grid;grid-template-rows:1fr auto auto;align-items:center;justify-items:center;min-height:0}
  #core{width:min(600px,100%);aspect-ratio:1;filter:drop-shadow(0 0 30px rgba(63,214,255,.15))}
  #stateLbl{font-size:12px;letter-spacing:.4em;color:var(--teal);margin-top:-18px}
  #caption{min-height:52px;max-width:620px;text-align:center;font-size:18px;font-weight:300;color:#e9e3da;margin:10px 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dock{display:flex;align-items:center;gap:12px;width:min(720px,100%);padding:10px}
  .mic{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#2b3b3d,#141b1d);border:1px solid var(--edge);color:var(--dim)}
  .mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  textarea{flex:1;resize:none;height:44px;max-height:140px;background:none;border:0;outline:0;color:var(--text);font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;padding:11px 4px}
  textarea:focus-visible{outline:0} .dock:focus-within{border-color:rgba(63,214,255,.35)}
  .btn{height:46px;padding:0 20px;border-radius:14px;font-weight:600;letter-spacing:.06em}
  .stop{background:rgba(255,155,106,.12);color:var(--warn);border:1px solid rgba(255,155,106,.35)}
  .send{background:linear-gradient(180deg,#6fe3ff,#2a9fe0);color:#021624;box-shadow:0 6px 24px rgba(63,214,255,.25)}

  .convo{display:flex;flex-direction:column;min-height:0;padding:18px 0 0}
  .convo .cap{padding:0 20px}
  #log{flex:1;overflow:auto;padding:12px 20px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:#233 transparent}
  .m{white-space:pre-wrap;padding:10px 14px;border-radius:14px;max-width:92%}
  .m{position:relative} .m time{display:block;font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:3px}
  .user{align-self:flex-end;background:rgba(255,255,255,.05);border-right:2px solid var(--amber);border-radius:14px 4px 4px 14px}
  .jarvis{background:linear-gradient(90deg,rgba(63,214,255,.1),rgba(63,214,255,.03));border-left:2px solid var(--teal);border-radius:4px 14px 14px 4px;box-shadow:inset 0 0 20px rgba(63,214,255,.04)}
  .err{color:var(--warn);font-size:12px}
  .cap em{font-style:normal;color:var(--teal);margin-right:10px}
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .gauge{position:relative;display:grid;place-items:center}
  .gauge svg{width:100%;transform:rotate(135deg)}
  .gauge circle{fill:none;stroke-linecap:round}
  .gauge .trk{stroke:rgba(63,214,255,.12);stroke-width:6;stroke-dasharray:198 264}
  .gauge .val{stroke:var(--teal);stroke-width:6;stroke-dasharray:0 264;transition:stroke-dasharray .9s;filter:drop-shadow(0 0 5px var(--teal))}
  .gauge .tick{stroke:rgba(63,214,255,.35);stroke-width:3;stroke-dasharray:1 5.1}
  .gauge b{position:absolute;top:36%;font-size:22px;font-weight:300}
  .gauge span{position:absolute;top:60%;font-size:10px;letter-spacing:.2em;color:var(--dim)}
  #bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
  .glass{overflow:hidden}
  .glass .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(120,220,255,.06) 50%,transparent 60%) -200% 0/200% 100% no-repeat;animation:shine 9s ease-in-out infinite}
  @keyframes shine{to{background-position:200% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .col>.glass,.convo,.dock{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .col>.glass:nth-child(2){animation-delay:.15s} .col>.glass:nth-child(3){animation-delay:.3s} .convo{animation-delay:.45s} .dock{animation-delay:.6s}
  body.stream .private{filter:blur(9px);user-select:none}

  #memory,#connections{align-content:start;overflow:auto}
  .list{max-width:900px} .mem{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)} .mem small{display:block;color:var(--dim)}
  h2{font-weight:300;font-size:26px;margin:0 0 18px}
  @media (max-width:1250px){#home{grid-template-columns:250px 1fr 330px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <div class="mark">J<span>·</span>A<span>·</span>R<span>·</span>V<span>·</span>I<span>·</span>S</div>
  <span class="chip" id="link"><i></i><span>Checking brain</span></span>
  <button class="chip" id="voiceBtn" aria-pressed="true"><i></i><span>Voice on</span></button>
  <button class="chip" id="streamBtn" aria-pressed="false" title="Blurs private panels for stream capture"><i></i><span>Stream mode off</span></button>
  <span class="chip" id="uptime"><i></i><span>Uptime 00:00:00</span></span>
  <div class="time"><b id="clock">--:--</b><small id="date"></small></div>
</header>
<nav aria-label="Main">
  <button data-go="home" aria-label="Command centre" title="Command centre"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button data-go="memory" aria-label="Memory" title="Memory"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 3 2 4 2 7h8c0-3 2-4 2-7a6 6 0 0 0-6-6zM9 20h6"/></svg></button>
  <button data-go="connections" aria-label="Connections" title="Connections"><svg viewBox="0 0 24 24"><path d="M9 7H6a5 5 0 0 0 0 10h3M15 7h3a5 5 0 0 1 0 10h-3M8 12h8"/></svg></button>
</nav>
<main>
  <section class="view" id="home">
    <div class="col">
      <div class="glass pad">
        <div class="cap"><em>01</em>Systems</div>
        <div class="gauges">
          <div class="gauge"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="42"/><circle class="val" id="cpuArc" cx="50" cy="50" r="42"/><circle class="tick" cx="50" cy="50" r="34"/></svg><b id="cpu">–</b><span>CPU</span></div>
          <div class="gauge"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="42"/><circle class="val" id="ramArc" cx="50" cy="50" r="42"/><circle class="tick" cx="50" cy="50" r="34"/></svg><b id="ram">–</b><span>RAM</span></div>
        </div>
        <div class="row"><span>Memories</span><b id="memCount" class="private">–</b></div>
      </div>
      <div class="glass pad">
        <div class="cap"><em>02</em>Active work</div>
        <div id="work">Nothing running.</div>
      </div>
      <div class="glass pad">
        <div class="cap"><em>03</em>Shortcuts</div>
        <div class="shortcuts">
          <button data-ask="Give me a quick briefing: what's the date, anything I should know today, and what's in my notes?">Morning briefing</button>
          <button data-ask="What's trending in gaming and streaming right now that I could make content about?">Content ideas</button>
          <button data-ask="What's the weather looking like today? Keep it short.">Weather</button>
        </div>
      </div>
    </div>
    <div class="center">
      <canvas id="core" aria-hidden="true"></canvas>
      <div style="text-align:center"><div id="stateLbl">STANDING BY</div><div id="caption" aria-live="polite">Evening, sir. What are we breaking today?</div></div>
      <form id="f" class="dock glass">
        <button type="button" class="mic" title="Voice input arrives with the voice milestone" aria-label="Microphone (not built yet)" disabled><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <textarea id="q" rows="1" placeholder="Talk to me, boss" aria-label="Message"></textarea>
        <button type="button" class="btn stop" id="stop">STOP</button>
        <button class="btn send">SEND</button>
      </form>
    </div>
    <div class="glass convo private"><div class="cap"><em>04</em>Conversation</div><div id="log"></div></div>
  </section>
  <section class="view" id="memory"><div class="list"><h2>Memory</h2><div id="mems" class="private"></div></div></section>
  <section class="view" id="connections"><div class="list"><h2>Connections</h2><div class="glass pad"><div class="cap">Claude</div><div id="conn" style="margin-top:8px">…</div></div></div></section>
</main>
<script src="core.js"></script>
<script src="renderer.js"></script>
</body></html>

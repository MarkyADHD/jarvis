<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Jarvis</title>
<style>
  :root{--bg:#0b0d10;--s1:#12151a;--s2:#181c22;--line:#232932;--text:#f1ece4;--dim:#9a968f;--accent:#3fd0c9;--accent2:#1d6f6b;--warn:#f0a36b;--r:14px}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:72px 1fr;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  nav{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
  .logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8ff5ee,var(--accent2) 70%);margin-bottom:18px;box-shadow:0 0 18px #3fd0c955}
  nav button{width:48px;height:48px;border:0;border-radius:12px;background:none;color:var(--dim);display:grid;place-items:center}
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav button[aria-current]{background:var(--s2);color:var(--accent)} nav button:hover{color:var(--text)}
  .shell{display:grid;grid-template-rows:auto 1fr;min-height:0}
  header{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;font-weight:600;letter-spacing:.32em;margin:0}
  .pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--dim);display:inline-flex;gap:6px;align-items:center}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)} .pill.ok i{background:var(--accent)} .pill.bad i{background:var(--warn)}
  #clock{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  section{display:none;min-height:0;overflow:auto;padding:28px} section.on{display:block}
  #chat.on{display:grid;grid-template-rows:auto 1fr auto;gap:18px;overflow:hidden}
  .stage{display:flex;align-items:center;gap:22px}
  #orb{width:120px;height:120px;flex:none}
  .stage h2{font-size:30px;font-weight:300;margin:0} .stage p{margin:4px 0 0;color:var(--dim)}
  #log{overflow:auto;padding-right:8px;display:flex;flex-direction:column;gap:14px}
  .m{max-width:760px;white-space:pre-wrap;padding:12px 16px;border-radius:var(--r)}
  .user{align-self:flex-end;background:var(--s2)} .jarvis{background:linear-gradient(180deg,#14201f,var(--s1));border:1px solid #1f3a38}
  .err{color:var(--warn);font-size:13px}
  form{display:flex;gap:10px;align-items:flex-end;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px}
  textarea:focus-visible{outline:0} form:focus-within{border-color:var(--accent2)}
  textarea{flex:1;resize:none;min-height:24px;max-height:160px;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:8px}
  .btn{height:44px;min-width:44px;padding:0 18px;border-radius:12px;border:0;font-weight:600}
  .send{background:var(--accent);color:#062321} .stop{background:#2a1c17;color:var(--warn)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:1100px}
  .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .card h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:600}
  .big{font-size:28px;font-weight:300} .meter{height:4px;background:var(--s2);border-radius:4px;margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .8s}
  .mem{padding:12px 0;border-bottom:1px solid var(--line)} .mem small{color:var(--dim)}
  h2.t{font-weight:300;font-size:24px;margin:0 0 18px}
  @media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style></head>
<body>
<nav aria-label="Main">
  <div class="logo" aria-hidden="true"></div>
  <button data-go="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></button>
  <button data-go="chat" title="Chat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
  <button data-go="memory" title="Memory" aria-label="Memory"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 3 2 4 2 7h8c0-3 2-4 2-7a6 6 0 0 0-6-6zM9 20h6"/></svg></button>
  <button data-go="connections" title="Connections" aria-label="Connections"><svg viewBox="0 0 24 24"><path d="M9 7H6a5 5 0 0 0 0 10h3M15 7h3a5 5 0 0 1 0 10h-3M8 12h8"/></svg></button>
</nav>
<div class="shell">
  <header><h1>JARVIS</h1><span class="pill" id="link"><i></i><span>Checking</span></span><span class="pill" id="state"><i></i><span>Idle</span></span><span id="clock"></span></header>
  <section id="home">
    <h2 class="t" id="hello">Evening, sir.</h2>
    <div class="grid">
      <div class="card"><h3>BRAIN</h3><div class="big" id="brain">…</div></div>
      <div class="card"><h3>CPU</h3><div class="big" id="cpu">–</div><div class="meter"><i id="cpuBar"></i></div></div>
      <div class="card"><h3>MEMORY IN USE</h3><div class="big" id="ram">–</div><div class="meter"><i id="ramBar"></i></div></div>
      <div class="card"><h3>REMEMBERED</h3><div class="big" id="memCount">–</div></div>
    </div>
  </section>
  <section id="chat">
    <div class="stage"><canvas id="orb" width="240" height="240" aria-hidden="true"></canvas><div><h2 id="orbTitle">Standing by</h2><p>Enter to send · Shift+Enter for a new line · Esc to stop</p></div></div>
    <div id="log" aria-live="polite"></div>
    <form id="f"><textarea id="q" rows="1" placeholder="Talk to me, boss" aria-label="Message"></textarea><button class="btn stop" type="button" id="stop">Stop</button><button class="btn send">Send</button></form>
  </section>
  <section id="memory"><h2 class="t">Memory</h2><div id="mems"></div></section>
  <section id="connections"><h2 class="t">Connections</h2><div class="grid"><div class="card"><h3>CLAUDE</h3><div id="conn">…</div></div></div></section>
</div>
<script src="renderer.js"></script>
</body></html>
